<style>
@font-face{font-family:"Inter Tight";src:url(/fonts/inter-tight.woff2) format("woff2");font-weight:100 900;font-display:swap}@font-face{font-family:"Inter";src:url(/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#141414,#f3f1ed);--soft:light-dark(#5e5a55,#b5afa7);--plaster:light-dark(#f2efea,#1c1b19);--line:light-dark(#e2ddd5,#34312d);--card:light-dark(#ffffff,#1b1a18);--red:light-dark(#d4001a,#ff4d57);--petrol:#1f5f63;--petrol2:#174a4d;--wa:#15803d;--star:#e0a100}

:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:76px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}

h2{font-size:clamp(28px,3.6vw,42px);font-weight:800;text-wrap:balance}
h3{font-size:19px;font-weight:600}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(40px,6vw,88px);padding-inline:max(5vw,16px)}
.demo{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:7px 16px}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;padding:12px max(5vw,16px)}
.logo{display:flex;align-items:center;gap:10px;font:800 20px "Inter Tight",sans-serif;text-decoration:none;margin-right:auto}
.logo i{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 200deg,#e9c46a,#c8553d,var(--petrol),#8fb9a8,#e9c46a)}
.links{display:flex;gap:22px;font-size:15px;font-weight:500}
.links a{text-decoration:none;padding:8px 0}
.links a:hover{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:12px;font:600 16px Inter,sans-serif;text-decoration:none;border:0;cursor:pointer;background:var(--plaster);color:var(--ink);transition:transform .15s}
.btn.main{background:var(--red);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.4)}

.btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,button:focus-visible,.ba input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
nav .btn{min-height:42px;padding:0 18px;font-size:15px}
.hero{position:relative;background:#0e2628;color:#fff;overflow:hidden;padding-bottom:clamp(48px,6vw,88px)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,38,40,.92) 0%,rgba(14,38,40,.78) 42%,rgba(14,38,40,.25) 72%,rgba(14,38,40,.1) 100%)}
.hero .hgrid{z-index:2}
.hgrid{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,72px);align-items:center}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:14px;margin-bottom:20px}
.pill b{width:8px;height:8px;border-radius:50%;background:#7ee2a8}
.lead{font-size:18px;opacity:.9;max-width:32em;margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.gline{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:15px}
.gline .st{color:#ffd35c;letter-spacing:2px}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:30px;max-width:560px}
.trust div{border-top:1.5px solid rgba(255,255,255,.35);padding-top:10px;font-size:14px;opacity:.92}
.trust b{display:block;font:800 26px "Inter Tight",sans-serif;opacity:1}
.calc{background:var(--card);color:var(--ink);border-radius:20px;padding:26px;display:grid;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.calc h3{font-size:21px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select{font:16px Inter,sans-serif;min-height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
input[type=range]{padding:0;border:0;min-height:30px;accent-color:var(--red)}

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--plaster);padding:5px;border-radius:12px}
.seg button{font:600 14px Inter,sans-serif;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.res{background:var(--plaster);border-radius:14px;padding:16px 18px}
.res span{font-size:14px;color:var(--soft)}
.res b{display:block;font:800 clamp(26px,3vw,36px) "Inter Tight",sans-serif;white-space:nowrap;margin:2px 0}
.owner h2{font-size:clamp(26px,2.8vw,34px)}
@media(min-width:981px){.bento .tile:nth-child(n+6){grid-column:span 2}.bento .tile.t3:nth-child(n+6){grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);column-gap:18px;align-content:center;padding:10px}.bento .tile.t3:nth-child(n+6) .t3d{grid-row:span 2}.bento .tile.t3:nth-child(n+6) h3{align-self:end;padding-inline:0}.bento .tile.t3:nth-child(n+6) p{align-self:start;padding-inline:0}}
.small{font-size:13px;color:var(--soft)}
.sub{font-size:16px;color:var(--soft);margin-top:12px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px 40px}
.sec-head p{color:var(--soft);max-width:34em}
.ba{position:relative;margin-top:30px;border-radius:20px;overflow:hidden;height:clamp(260px,38vw,440px);background:#bdb6ab;user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .after{clip-path:inset(0 0 0 var(--x,50%))}
.ba .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:#fff;transform:translateX(-50%);pointer-events:none}
.ba .knob{position:absolute;top:50%;left:var(--x,50%);width:52px;height:52px;border-radius:50%;background:#fff;color:#141414;display:grid;place-items:center;transform:translate(-50%,-50%);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.proj{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.proj button{font:600 15px Inter,sans-serif;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.proj button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{position:absolute;top:16px;padding:6px 12px;border-radius:999px;background:rgba(20,20,20,.7);color:#fff;font-size:14px;font-weight:600;pointer-events:none}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:30px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:10px;align-content:start}
.tile.big{grid-column:span 2;grid-row:span 2;background:var(--petrol);color:#fff;border:0;align-content:end;min-height:300px;position:relative;overflow:hidden}
.tile.big img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,38,40,0) 25%,rgba(14,38,40,.88) 100%)}
.tile.big>*:not(img){z-index:1}
.tile.big>*{position:relative}
.tile p{color:var(--soft);font-size:15px}
.tile.t3{padding:10px 10px 20px}.tile.t3 h3,.tile.t3 p{padding-inline:10px}
.t3d{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#F2EFEA;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tile.t3:hover .t3d{transform:scale(1.04) rotate(-.6deg)}
@media(prefers-reduced-motion:reduce){.tile.t3:hover .t3d{transform:none}}
.tile.t3{overflow:hidden}
.tile.big p{color:#fff;opacity:.9}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:start}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
th,td{text-align:left;padding:14px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--soft);font-size:14px}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:30px}
.step{background:var(--card);border-radius:18px;padding:22px;border:1px solid var(--line)}
.step i{font:normal 800 15px "Inter Tight",sans-serif;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;margin-bottom:14px}
.step p{color:var(--soft);font-size:15px;margin-top:6px}
.revtop{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-top:28px}
.revtop .score{font:800 44px "Inter Tight",sans-serif;line-height:1}
.st{color:var(--star);letter-spacing:2px;font-size:18px}
.gl{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.gl i{width:22px;height:22px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}
.revtop .btn{margin-left:auto}
.revs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:10px;align-content:start}
.rev .who{display:flex;align-items:center;gap:10px;font-weight:600}
.rev .who span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.rev p{color:var(--soft);font-size:15px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:18px 36px 18px 0;font-weight:600;font-size:17px;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:12px;font-size:26px;font-weight:400;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 18px;color:var(--soft)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
/* Online-Termin */
.tbuch{display:grid;gap:12px}
.tlbl{font-size:14px;font-weight:600}
.tdays{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tdays button,.tslots button{font:600 14px Inter,sans-serif;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:46px}
.tdays button{flex:none;min-width:68px;padding:6px 10px;display:grid;line-height:1.25}
.tdays button small{font-size:12px;color:var(--soft);font-weight:500}
.tslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdays button[aria-pressed=true],.tslots button[aria-pressed=true]{border-color:var(--red);background:var(--red);color:#fff}
.tdays button[aria-pressed=true] small{color:#fff}
.tslots button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.ok{display:none;background:var(--plaster);border-left:4px solid var(--red);padding:16px;border-radius:10px}
.ok.show{display:block}
.contact{display:grid;gap:12px;margin-top:24px}
.contact div{display:flex;gap:12px;flex-wrap:wrap}
.contact b{min-width:7em}
footer{background:var(--ink);color:var(--bg)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;font-size:14px}
footer p{opacity:.75}
.lang{display:flex;background:var(--plaster);border-radius:10px;padding:3px}
.lang button{font:600 14px Inter,sans-serif;min-height:36px;min-width:40px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.owner{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center}
.owner img{width:200px;height:200px;border-radius:24px;display:block;object-fit:cover}
.facts2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.facts2 div{background:var(--plaster);border-radius:14px;padding:14px;font-size:14px}
.facts2 b{display:block;font:800 20px "Inter Tight",sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{background:var(--plaster);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.wiz-steps{display:flex;gap:6px}
.wiz-steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.wiz-steps i.on{background:var(--red)}
.wiz-p{display:none;gap:14px}
.wiz-p.on{display:grid}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts button{font:600 15px Inter,sans-serif;min-height:64px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:left;padding:12px 14px}
.opts button[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--bg))}
.wnav{display:flex;gap:10px}
.wnav .btn{flex:1}
.wafab{position:fixed;right:22px;bottom:22px;z-index:30;width:60px;height:60px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .15s}
.wafab:hover{transform:scale(1.06)}
.wafab svg{width:32px;height:32px;fill:#fff}
.mbar{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media(max-width:980px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.revs{grid-template-columns:minmax(0,1fr)}}
@media(max-width:800px){.hgrid,.two{grid-template-columns:minmax(0,1fr)}.links{display:none}}
@media(max-width:600px){.owner{grid-template-columns:minmax(0,1fr)}.owner img{width:140px;height:140px}.facts2{grid-template-columns:minmax(0,1fr)}.bento,.steps,.row2{grid-template-columns:minmax(0,1fr)}.tile.big{grid-column:auto;grid-row:auto;min-height:240px}.trust b{font-size:21px}.cta .btn{flex:1}nav .btn{display:none}.ba{height:260px}.revtop .btn{margin-left:0;width:100%}.wafab{display:none}.mbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}.mbar .btn{padding:0 8px;font-size:15px}body{padding-bottom:72px}}
.calc h2{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:wrap}
</style>

<body>
<div class="demo"><span data-t="demo"></span> · <a href="/" style="color:inherit">← Offertenmeister</a></div>
<nav><div class="wrap">
  <a class="logo" href="#top"><i></i>Malerei Muster</a>
  <div class="links"><a href="#vorher" data-t="nBA"></a><a href="#leistungen" data-t="nSvc"></a><a href="#preise" data-t="nPr"></a><a href="#bewertungen" data-t="nRev"></a><a href="#offerte" data-t="nCon"></a></div>
  <div class="lang" role="group" aria-label="Sprache / Language"><button type="button" aria-pressed="true" data-l="de">DE</button><button type="button" aria-pressed="false" data-l="en">EN</button></div>
  <a class="btn main" href="#offerte" data-t="quoteFree"></a>
</div></nav>

<main>
<header class="band hero" id="top">
  <img class="hero-bg" src="img/hero-v2.webp" width="1344" height="752" alt="" fetchpriority="high">
  <div class="wrap hgrid">
    <div>
      <span class="pill"><b></b><span data-t="slots"></span></span>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="cta"><a class="btn main" href="#offerte" data-t="quoteReq"></a><a class="btn ghost" href="#vorher" data-t="seeWork"></a></div>
      <a class="gline" href="#bewertungen" style="text-decoration:none"><span class="st">★★★★★</span><b>4.9</b><span data-t="gline"></span></a>
      <div class="trust"><div><b>2013</b><span data-t="tr1"></span></div><div><b>48 h</b><span data-t="tr2"></span></div><div><b data-t="tr3b"></b><span data-t="tr3"></span></div></div>
    </div>
    <div class="calc" id="rechner">
      <h2 data-t="calcH"></h2>
      <div class="seg" role="group" id="seg"><button type="button" aria-pressed="true" data-c="0" data-t="cat0"></button><button type="button" aria-pressed="false" data-c="1" data-t="cat1"></button><button type="button" aria-pressed="false" data-c="2" data-t="cat2"></button></div>
      <label for="cwork"><span data-t="work"></span><select id="cwork"></select></label>
      <label for="carea"><span><span data-t="area"></span>: <span id="careaV">60 m²</span></span><input type="range" id="carea" min="5" max="400" step="5" value="60"></label>
      <div class="res"><span data-t="guide"></span><b id="cres">–</b><span id="cnote"></span></div>
      <a class="btn main" href="#offerte" data-t="exact"></a>
      <p class="small" data-t="demoPr"></p>
    </div>
  </div>
</header>

<section class="band" id="vorher"><div class="wrap">
  <div class="sec-head"><h2 data-t="baH"></h2><p data-t="baP"></p></div>
  <div class="ba" id="ba">
    <img id="baB" src="img/wohnzimmer-vorher.webp" width="1072" height="600" alt="">
    <img id="baA" class="after" src="img/wohnzimmer-nachher.webp" width="1072" height="600" alt="">
    <span class="tag" style="left:16px" data-t="before"></span><span class="tag" style="right:16px" data-t="after"></span>
    <div class="bar"></div><div class="knob">↔</div>
    <input type="range" min="0" max="100" value="50" id="bax" aria-label="Vorher / nachher">
  </div>
  <div class="proj" role="group" id="proj"><button type="button" aria-pressed="true" data-p="0" data-t="p1"></button><button type="button" aria-pressed="false" data-p="1" data-t="p2"></button></div>
</div></section>

<section class="band" id="leistungen" style="padding-top:0"><div class="wrap">
  <div class="sec-head"><h2 data-t="svcH"></h2><p data-t="svcP"></p></div>
  <div class="bento" id="bento"></div>
</div></section>

<section class="band" id="preise" style="background:var(--plaster)"><div class="wrap two">
  <div>
    <h2 data-t="prH"></h2>
    <p class="sub" data-t="prP"></p>
    <div class="step" style="margin-top:24px"><i>✓</i><h3 data-t="fixH"></h3><p data-t="fixP"></p></div>
  </div>
  <div><div style="overflow-x:auto"><table><thead><tr><th data-t="work"></th><th class="n" data-t="from"></th></tr></thead><tbody id="ptab"></tbody></table></div><p class="small" style="margin-top:10px" data-t="demoPr"></p></div>
</div></section>

<section class="band" id="ablauf"><div class="wrap">
  <h2 data-t="stepsH"></h2>
  <div class="steps" id="steps"></div>
</div></section>

<section class="band" id="bewertungen" style="background:var(--plaster)"><div class="wrap">
  <div class="sec-head"><h2 data-t="revH"></h2><p data-t="revP"></p></div>

 $('bento').innerHTML=t.tiles.map((x,i)=>i===0?`<div class="tile big"><img class="bg" src="img/handwerk.webp" alt="" loading="lazy"><div class="ico" style="background:rgba(255,255,255,.18)"><svg viewBox="0 0 24 24"><path d="${icons[i][0]}"/></svg></div><h3 style="font-size:26px">${x[0]}</h3><p>${x[1]}</p></div>`:`<div class="tile t3"><img class="t3d" src="img/s${i}.webp" width="536" height="404" alt="" loading="lazy"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('');
 $('revs').innerHTML=t.revs.map((r,i)=>`<div class="rev"><div class="who"><span style="background:${avc[i]}">${r[0][0]}</span><div>${r[0]}<div class="small">${r[1]} · Google</div></div></div><div class="st">★★★★★</div><p>${r[2]}</p></div>`).join('');
 const op=[...$('faq').querySelectorAll('details')].map(d=>d.open);
 $('faq').innerHTML=t.faq.map((q,i)=>`<details ${(op.length?op[i]:i===0)?'open':''}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
 $('wopts').innerHTML=t.wo.map((w,i)=>`<button type="button" aria-pressed="${i===pick}" data-i="${i}">${w}</button>`).join('');
 fill();calc();showStep();
 document.documentElement.lang=L==='en'?'en':'de-CH';
};

$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=+b.dataset.c;$('seg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fill();calc()});
$('cwork').addEventListener('change',calc);$('carea').addEventListener('input',calc);
const ba=$('ba'),bx=$('bax');const setX=()=>ba.style.setProperty('--x',bx.value+'%');bx.addEventListener('input',setX);setX();
const PJ=[['img/wohnzimmer-vorher.webp','img/wohnzimmer-nachher.webp'],['img/fassade-vorher.webp','img/fassade-nachher.webp']];
$('proj').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.p;$('proj').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('baB').src=PJ[i][0];$('baA').src=PJ[i][1]});

$('wopts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pick=+b.dataset.i;$('wopts').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));step=1;showStep()});
$('wback').addEventListener('click',()=>{step=Math.max(0,step-1);showStep()});
$('f').addEventListener('submit',e=>e.preventDefault());
$('wnext').addEventListener('click',()=>{const t=T[L],ok=$('ok');
 if(step===0&&pick<0){ok.textContent=t.errPick;ok.classList.add('show');return}
 if(step<2){step++;showStep();return}
 const n=$('fname').value.trim(),tel=$('ftel').value.trim();
 if(!n||!tel){ok.textContent=t.errC;ok.classList.add('show');return}
 ok.innerHTML=t.thx(n.replace(/[<>&"]/g,''),t.wo[pick]);ok.classList.add('show')});

document.querySelectorAll('.walink').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.hash='offerte';const ok=$('ok');ok.textContent=T[L].waDemo;ok.classList.add('show')}));

document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;L=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
render();
}
</script>
